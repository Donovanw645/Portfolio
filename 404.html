<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<!-- Self-contained: a 404 can be served from any depth, so it carries its own
     styles rather than relying on relative asset paths. -->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    padding: 40px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ffffff; color: #4a5663;
    text-align: center;
  }
  .wrap { max-width: 520px; }
  .mark {
    display: inline-grid; place-items: center;
    width: 46px; height: 46px; margin-bottom: 28px;
    background: #0c2340; color: #fff;
    font-size: 15px; font-weight: 700; letter-spacing: .02em;
    border-radius: 2px;
  }
  .code {
    font-size: 12px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: #14406e; margin-bottom: 14px;
  }
  h1 {
    margin: 0 0 14px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 600;
    color: #101a26; letter-spacing: -.015em;
  }
  p { margin: 0 0 30px; line-height: 1.65; }
  a.btn {
    display: inline-block; padding: 13px 26px;
    background: #0c2340; color: #fff;
    font-size: 15px; font-weight: 600;
    text-decoration: none; border-radius: 2px;
    border: 1px solid #0c2340;
  }
  a.btn:hover { background: #14406e; border-color: #14406e; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1825; color: #adb9c7; }
    h1 { color: #eaeff5; }
    .code { color: #5f95cc; }
    .mark { background: #14243a; }
    a.btn { background: #14406e; border-color: #14406e; }
    a.btn:hover { background: #2d6396; border-color: #2d6396; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="mark" aria-hidden="true">DW</span>
    <div class="code">Error 404</div>
    <h1>This page could not be found</h1>
    <p>The page you requested does not exist or has been moved. Use the link below to return to the portfolio.</p>
    <a class="btn" id="home" href="/">Return to homepage</a>
  </div>
  <script>
    /* On a project Pages site the root is /<repo>/, not /. Work it out from
       the current path so the link is correct either way. */
    (function () {
      var segments = location.pathname.split("/").filter(Boolean);
      var root = location.hostname.indexOf("github.io") !== -1 && segments.length
        ? "/" + segments[0] + "/"
        : "/";
      document.getElementById("home").setAttribute("href", root);
    })();
  </script>
</body>
</html>
